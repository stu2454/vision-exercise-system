# Vision Exercise System — application configuration
#
# Engineering parameters only. These are not clinical thresholds, and the
# values below are starting points to be established experimentally
# (Document 03 §33, CLAUDE.md §24, §37).

application:
  log_level: INFO

camera:
  # webcam   USB camera via OpenCV (development machines)
  # picamera Raspberry Pi Camera Module via picamera2
  # A CSI camera cannot be opened by OpenCV on Pi OS Bookworm, so a Pi with
  # a Camera Module must set this to picamera. See docs/raspberry-pi-setup.md.
  source: webcam
  device_index: 0
  width: 1280
  height: 720
  fps: 30
  # Show the participant a mirror image. Applied before pose estimation.
  mirror: true
  # picamera only. If captured colour looks swapped, try BGR888 — the
  # libcamera format names are reversed relative to numpy channel order.
  picamera_format: RGB888
  # Camera placement is an open experimental variable (Document 03 §10).
  # Record what was actually used: frontal | frontal_oblique | lateral.
  view: unspecified
  nominal_height_cm: null
  nominal_distance_m: null

pose:
  engine: mediapipe
  # pose_landmarker_lite.task is the default for interactive frame rates.
  # pose_landmarker_full.task is more accurate and slower; compare them on
  # the same recording rather than by impression.
  model_path: models/pose_landmarker_lite.task
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5

pose_quality:
  # Landmarks that must be usable for GOOD quality. Individual exercises
  # will override this from their own configuration in later builds.
  required_landmarks:
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_shoulder
    - right_shoulder
    - left_ankle
    - right_ankle
  good_confidence: 0.60
  minimum_confidence: 0.30
  person_confidence_floor: 0.30
  # Normalised distance from an image edge treated as clipping.
  edge_margin: 0.02
  # Landmark speed above which motion is treated as tracking noise,
  # in image-normalised units per second.
  max_jump_normalised_per_second: 3.0
  # Quality is allowed to worsen quickly but must improve steadily, so a
  # single good frame cannot restart scoring after tracking loss.
  frames_to_worsen: 2
  frames_to_improve: 5

filtering:
  # Landmark smoothing. Raw landmarks jitter enough to cross any threshold
  # repeatedly within a held posture (CLAUDE.md §8).
  # none | exponential_moving_average | moving_median | one_euro
  kind: exponential_moving_average
  # Lag in milliseconds. Larger is smoother and slower to respond. Expressed
  # in time, not frames, because measured capture rate drifts between 27.9
  # and 29.9 fps within a single session.
  time_constant_ms: 80.0
  # moving_median only.
  window: 5
  # one_euro only.
  min_cutoff_hz: 1.0
  beta: 0.007
  derivative_cutoff_hz: 1.0
  # Gap after which filter state is discarded rather than blended across a
  # tracking loss, which would fabricate movement that did not happen.
  max_gap_ms: 250.0

features:
  # Landmark confidence below which a derived feature is marked invalid.
  minimum_confidence: 0.30
  # Longest interval across which a velocity is computed. A larger gap means
  # frames were dropped, and the result would not describe real movement.
  maximum_elapsed_ms: 250.0

recording:
  directory: recordings
  # Video recording is always an explicit developer action (CLAUDE.md §28).
  record_video: false
  video_fourcc: mp4v

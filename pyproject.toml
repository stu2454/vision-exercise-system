[project]
name = "vision-exercise-system"
version = "0.1.0"
description = "Camera-based home exercise delivery and monitoring prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Pinned exactly, because aarch64 wheel availability is erratic and the
    # Raspberry Pi 5 is a target platform. MediaPipe published Linux aarch64
    # wheels up to 0.10.18, dropped them for 0.10.21 through 0.10.35, and
    # restored them in 1.0. 0.10.18 is the newest release with wheels for
    # both linux aarch64 and macOS arm64, so one version covers the Pi and
    # the development machine. MediaPipe 1.0.1 aborts on macOS arm64 inside
    # its Metal helper, so it is not a usable alternative today.
    # See docs/decisions/ADR-012-raspberry-pi-deployment.md.
    "mediapipe==0.10.18",
    "opencv-python>=4.9,<5",
    "numpy>=1.26,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
vision-exercise = "src.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The repository structure in Document 03 §47 puts application code under a
# top-level `src` package rather than in a src-layout, so it is named here
# explicitly; automatic discovery would otherwise also try to package
# `config`, `docs`, `tests` and `tools`.
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises the real pose engine; slower than unit tests",
]

exercise_id: STS-001

# Ten good repetitions, four slow ones with a deliberate pause part-way
# through the rise, then four deliberately incomplete rises.
true_repetitions: 14
partial_repetitions: 4

camera_view: frontal
hand_support_reps: []
use_gestures: false

notes: >
  The case that showed continuously adapting calibration cannot detect
  reduced movement. The ten good repetitions reached a hip height of 0.434
  and the four incomplete rises reached 0.380 -- a real, measurable
  difference -- but calibration had by then re-learned standing as 0.373, so
  every incomplete rise measured as above full standing and all four were
  counted. Calibration now freezes once established.

  It also retired a suspected weakness. Pausing part-way through a rise was
  expected to prevent RISING being entered at all, because rising is
  confirmed by upward velocity. All four paused repetitions were detected
  correctly, with rise times of 6.5, 3.5, 2.0 and 1.6 seconds.

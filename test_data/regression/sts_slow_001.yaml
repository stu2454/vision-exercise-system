case_id: sts_slow_001
recording: dev_20260816_140040.jsonl
exercise_id: STS-001

# Twelve, not the eleven first reported. The participant counted their
# repetitions but not the first one, which they thought of as calibration.
# It was a full sit-to-stand like the others and the engine counted it,
# correctly: calibration completed during the post-signal sit-down, so no
# repetition was consumed by it.
#
# The second recalled count in this dataset to be wrong, in the opposite
# direction to the first. Counting while exercising is unreliable.
true_repetitions: 12
partial_repetitions: 0
camera_view: frontal
hand_support_reps: []
use_gestures: true

notes: >
  Deliberate speed variation, the first case in the dataset with any. Three
  fast repetitions at 1.8s, two slow at 5.5 and 6.4s, then seven at 2.5 to
  3.1s. Descents range 0.23 to 1.60s.

  This is the recording that showed rapid_descent to be measuring the wrong
  thing: an absolute 0.5s threshold flagged 11 of these 12, including the
  deliberately slow ones. It also showed the stop-gesture hold to be longer
  than a person actually holds, at exactly 1.00s against a 1.00s threshold.

  The participant signalled the start while standing, then sat down. The
  preparatory sit-down is correctly not counted as a repetition.
